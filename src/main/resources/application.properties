spring.application.name=tiny-url-lab

# Server Configuration
server.port=8080

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:tinylinkdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Application Configuration
app.base-url=http://localhost:8080

# Logging Configuration
logging.level.com.example.tinyurllab=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springdoc=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# DevTools Configuration - Exclude springdoc and security from restart
spring.devtools.restart.additional-exclude=io/swagger/**,org/springdoc/**,org/springframework/security/**
spring.devtools.restart.exclude=META-INF/maven/**,META-INF/resources/**,resources/**,static/**,public/**,templates/**,**/*Test.class,**/*Tests.class

# Spring AI Anthropic Configuration (disabled for now due to jackson version conflict)
spring.autoconfigure.exclude=org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
#spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
#spring.ai.anthropic.chat.model=claude-3-5-sonnet-20241022
#spring.ai.anthropic.chat.options.temperature=0.7
#spring.ai.anthropic.chat.options.max-tokens=4096

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,info,httptrace
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Enable detailed metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.tomcat=true
management.metrics.enable.logback=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.observations.annotations.enabled=true

# Configure SLOs for latency monitoring
management.metrics.distribution.percentiles.http.server.requests=0.5,0.75,0.95,0.99
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s
