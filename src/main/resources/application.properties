spring.application.name=tiny-url-lab

server.port=8080

# In-memory H2 is appropriate only for local/prototype use.
spring.datasource.url=jdbc:h2:mem:tinylinkdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console is disabled unless explicitly enabled for local debugging.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# SecurityConfig reads these environment-backed properties.
app.security.user-password=${APP_SECURITY_USER_PASSWORD:user123}
app.security.admin-password=${APP_SECURITY_ADMIN_PASSWORD:admin123}

app.base-url=http://localhost:8080
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
app.rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:60000}
app.rate-limit.trusted-proxies=${TRUSTED_PROXIES:}

logging.level.com.example.tinyurllab=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springdoc=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.defaultModelsExpandDepth=-1
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.override-with-generic-response=false
springdoc.writer-with-default-pretty-printer=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

spring.autoconfigure.exclude=org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.base-path=/actuator

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.tomcat=true
management.metrics.enable.logback=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.observations.annotations.enabled=true

management.metrics.distribution.percentiles.http.server.requests=0.5,0.75,0.95,0.99
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s
